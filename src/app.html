function supDL(){return `<datalist id=sups>${S.sup.map(s=>`<option value="${E(dn(s,S.sup))}" label="${E((s.cat||'')+' · '+(s.phone||''))}"></option>`).join('')}</datalist>`}
function supSel(u,i,v){const r=R(u,i),e=S.sup.find(s=>dn(s,S.sup)==v)||S.sup.find(s=>s.name==v);if(e){r.sup=e.name;r.ph=e.phone;toast('Подставлен телефон: '+e.phone)}else r.sup=v;save(u,r)}
function phSet(u,i,v){const r=R(u,i);r.ph=v;save(u,r);const p=dg(v);if(r.sup&&p.length>=10&&!S.sup.some(s=>s.name==r.sup)){supsave(S.sup.concat({id:ID(),name:r.sup,phone:v,cat:'',kind:'goods',addr:''}));toast('Поставщик добавлен в справочник')}}
function supf(id,f,v){supsave(S.sup.map(s=>s.id==id?{...s,[f]:v}:s))}
function supAdd(){const n=$('#sn').value.trim();if(!n)return;supsave(S.sup.concat({id:ID(),name:n,phone:$('#sp').value.trim(),cat:$('#sc').value.trim(),kind:'goods',addr:''}));toast('Добавлен: '+n);draw()}
function supd(id){if(!B['sd'+id]){B['sd'+id]=1;draw();return}B['sd'+id]=0;supsave(S.sup.filter(s=>s.id!=id));draw()}
function sup(){const q=(B.sq||'').toLowerCase(),L=S.sup.filter(s=>!q||(s.name+' '+(s.cat||'')+' '+(s.phone||'')).toLowerCase().includes(q)).sort((a,b)=>String(a.name).localeCompare(String(b.name),'ru')).slice(0,120),w=p=>dg(p).replace(/^8/,'7');
return `<h2>Поставщики <small class=m>${S.sup.length}</small></h2><div class=card><input id=sn placeholder="Имя поставщика"><div class=two><input id=sp type=tel placeholder="Телефон"><input id=sc placeholder="Что поставляет"></div><button onclick="supAdd()">Добавить в справочник</button></div><input placeholder="Поиск: имя, товар, телефон" value="${E(B.sq||'')}" onchange="B.sq=this.value;this.blur();draw()">`+L.map(s=>`<div class=card><input value="${E(s.name)}" style="font-weight:700" onchange="supf('${s.id}','name',this.value)"><div class=two><input type=tel value="${E(s.phone)}" onchange="supf('${s.id}','phone',this.value)"><input value="${E(s.cat)}" placeholder="что поставляет" onchange="supf('${s.id}','cat',this.value)"></div><select onchange="supf('${s.id}','pay',this.value)"><option value="" ${!s.pay?'selected':''}>Способ оплаты: любой</option><option value=cash ${s.pay=='cash'?'selected':''}>Принимает наличные</option><option value=bank ${s.pay=='bank'?'selected':''}>Только банк</option></select><div class=row><span><a href="tel:+${w(s.phone)}">Позвонить</a> · <a href="https://wa.me/${w(s.phone)}" target=_blank>WhatsApp</a></span><a onclick="supd('${s.id}')">${B['sd'+s.id]?'Точно удалить?':'удалить'}</a></div>${FB?supLk(s):''}${s.addr?`<small class=m>${E(s.addr)}</small>`:''}</div>`).join('')}if(typeof window!='undefined'){window.addEventListener('error',e=>toast('Ошибка: '+(e.message||'')));window.addEventListener('unhandledrejection',e=>toast('Ошибка записи: '+((e.reason&&(e.reason.message||e.reason.code))||e.reason)))}
document.addEventListener('focusout',()=>setTimeout(()=>dirty&&draw(),200));
</script></body></html>
