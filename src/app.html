function sendSup(u,i){const r=R(u,i);if(!r||!r.sup)return;const e=supEnsure(r.sup,r.ph),k=u+'_'+i,old=srOf(u,r),pv={};((old&&old.d.lines)||[]).forEach(l=>{if(!l.add)pv[String(l.n).trim()]=l});

function applyInv(u,i){const r=R(u,i),m=r&&srOf(u,r);if(!m)return;const used=new Set();
 (m.d.lines||[]).forEach((sl,k)=>{let j=-1;if(!sl.add){j=r.lines.findIndex((l,x)=>!used.has(x)&&!l.disc&&String(l.n).trim()==String(sl.n).trim());if(j<0&&k<r.lines.length&&!used.has(k)&&!r.lines[k].disc)j=k}
  if(j>=0){used.add(j);const l=r.lines[j];if(String(sl.q)!=String(l.q)){if(l.q0==null)l.q0=l.q;l.q=sl.q}l.p=pn(sl.p);l.ps=1;delete l.pb;delete l.pc}
  else r.lines.push({n:sl.n,q:sl.q,p:pn(sl.p),ps:1,add:1,c:'',g:(r.lines[0]||{}).g||''})});
 if(pn(m.d.disc))r.lines.push({n:'Скидка поставщика',q:'1',p:-Math.abs(pn(m.d.disc)),disc:1});
 if(m.d.inv)r.inv=m.d.inv;r.st='inv';
 save(u,r).then(ok=>{if(ok){db.doc(m.p).update({st:'ok',okAt:Date.now()});toast('Счёт принят: '+F(tot(r))+' ₸ — заявка «К оплате»')}})}

async function gdTok(){if(GD.tok&&Date.now()<GD.exp)return GD.tok;try{const x=JSON.parse(sessionStorage.getItem('remont_gd')||'null');if(x&&Date.now()<x.e){GD.tok=x.t;GD.exp=x.e;return x.t}}catch(e){}

function gdTokNow(){if(GD.tok&&Date.now()<GD.exp)return GD.tok;try{const x=JSON.parse(sessionStorage.getItem('remont_gd')||'null');if(x&&Date.now()<x.e)return x.t}catch(e){}return ''}
async function gdF(tok,url,o={}){const r=await fetch(url,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+tok}});
 if(r.status==401){GD.tok='';try{sessionStorage.removeItem('remont_gd')}catch(e){}throw Object.assign(new Error('доступ к Диску истёк — нажмите ещё раз'),{c:401})}
 if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error('Google Диск: '+(m||('ошибка '+r.status)))}return r.json()}

 const q=encodeURIComponent("name='"+GDF+"' and mimeType='application/vnd.google-apps.folder' and trashed=false"),L=await gdF(tok,'https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id)');if(L.files&&L.files[0])return L.files[0].id;

  const f=await gdF(tok,'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp}),kb=Math.round(body.length/1024),m={folder:fid,last:T(),at:Date.now(),file:f.id,kb,n:((S.gd||{}).n||0)+1};
